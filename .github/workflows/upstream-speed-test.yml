name: Sphaira original-engine speed test
on:
  push:
    branches: [benchmark/known-good-9mbs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Verify original benchmark and transfer code are unchanged
        run: |
          test "$(git hash-object sphaira/source/speed_test.cpp)" = "803cd2440397c07e4ff01e9f442e8c61e3deb2da"
          test "$(git hash-object sphaira/source/yati/source/http.cpp)" = "b3b1bbddce3ed80b62a721ffbb5d81439e2ebcca"
          test "$(git hash-object sphaira/source/threaded_file_transfer.cpp)" = "b865aab1dad869b2964e5d0b9e864645ce568f3d"
          test "$(git hash-object sphaira/source/utils/devoptab_common.cpp)" = "559b103f40efe511e0208dc6c687312bb68ad391"
          test "$(git hash-object sphaira/source/ui/progress_box.cpp)" = "7157686c8f369c8fda86630a8c26dff0c1d451c2"
          test "$(git hash-object sphaira/source/ui/option_box.cpp)" = "19b648cd752bcb4a42a7f9dfa5530cf1aa207a90"
          test "$(git hash-object sphaira/source/ui/menus/main_menu.cpp)" = "9b74626fdff2878910ee4fb9a5abdb597cc5ee85"
          test ! -d assets/romfs/assoc
      - name: Original Sphaira dependencies
        run: |
          apt-get update && apt-get install -y texinfo
          git config --global --add safe.directory '*'
          git clone --depth 1 -b iosupport https://github.com/R-YaTian/newlib.git /tmp/newlib
          (cd /tmp/newlib && bash ./build-libgloss-local.sh)
          git clone --depth 1 --recurse-submodules https://github.com/switchbrew/libnx.git /tmp/libnx
          make -C /tmp/libnx install -j4
      - uses: lukka/get-cmake@v4.4.2
      - name: Restore incremental build
        uses: actions/cache@v4
        with:
          path: build/Lite
          key: minimal-speed-test-lite-v1-${{ github.sha }}
          restore-keys: |
            upstream-test-lite-v1-
      - name: Configure upstream Sphaira Lite
        run: cmake --preset Lite -DLTO=OFF
      - name: Incremental compile (upstream sources)
        run: cmake --build --preset Lite --parallel 4
      - name: Package and verify NRO
        run: |
          cp build/Lite/sphaira.nro build/Lite/SphairaSpeedTester.nro
          python3 - <<'PY'
          from pathlib import Path
          b=Path("build/Lite/SphairaSpeedTester.nro").read_bytes()
          assert b[16:20]==b"NRO0"
          print("Verified NRO:", len(b), "bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SphairaSpeedTester-OriginalEngine
          path: build/Lite/SphairaSpeedTester.nro
          if-no-files-found: error
