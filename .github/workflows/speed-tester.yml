name: Build Sphaira Speed Tester
on:
  push:
    branches:
      - experiment/minimal-speed-tester
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the isolated NRO
        run: make -C speedtester -j2
      - uses: actions/upload-artifact@v4
        with:
          name: SphairaSpeedTester-NRO
          path: speedtester/SphairaSpeedTester.nro
          if-no-files-found: error
